<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Coffee Shop</title>

<!-- PWA / iOS home-screen -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#151918">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coffee Shop">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">

<link rel="stylesheet" href="../../shared/fonts.css">
<link rel="stylesheet" href="../../shared/theme.css">
<style>
  .back{display:inline-block;color:var(--muted);text-decoration:none;font-size:13px;margin-bottom:4px;}
  .back:hover{color:var(--amber);}

  .play{display:block;width:150px;height:150px;margin:8px auto 18px;border-radius:50%;
    border:1px solid var(--line);background:var(--panel-2);color:var(--amber);font-size:52px;
    cursor:pointer;user-select:none;transition:transform .05s,background .15s;}
  .play:active{transform:scale(.95);}
  .play.on{background:var(--amber);border-color:var(--amber);color:#151918;}
  .state{text-align:center;font-family:'Barlow Semi Condensed','Inter',sans-serif;font-weight:600;
    text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted);margin-bottom:6px;}

  input[type=range]{padding:0;border:none;background:none;accent-color:var(--amber);height:28px;}

  .dl{width:100%;border:1px solid var(--amber);background:var(--amber);color:#151918;
    font-family:'Barlow Semi Condensed','Inter',sans-serif;font-weight:700;text-transform:uppercase;
    letter-spacing:.04em;font-size:15px;border-radius:10px;padding:13px;cursor:pointer;}
  .dl:disabled{opacity:.6;cursor:default;}
  .note{color:var(--muted);font-size:12px;line-height:1.5;margin:10px 0 0;}
</style>
</head>
<body>
  <a class="back" href="../../" id="backOS">&lsaquo; OS</a>
  <div class="header"><div><h1>Coffee Shop</h1><p class="sub">Generated on the phone. No network needed.</p></div></div>

  <button class="play" id="play" aria-label="Play">&#9654;</button>
  <div class="state" id="state">Stopped</div>

  <div class="card">
    <div class="lbl">Volume <span class="hint" id="volTxt"></span></div>
    <input type="range" id="vol" min="0" max="100" step="1">
  </div>

  <div class="card">
    <div class="lbl">Download <span class="hint">60 min WAV · 159 MB</span></div>
    <button class="dl" id="dl">Download 60 min</button>
    <p class="note">Save it to Files or a music app to play with the screen locked or in the background — iOS pauses in-browser audio when the phone locks.</p>
  </div>

<script src="../../shared/storage.js"></script>
<script src="../../shared/pwa.js"></script>
<script>
registerPWA('sw.js');
(function(){var b=document.getElementById('backOS');if(b){var m=location.pathname.match(/^(.*?\/)apps\//);if(m)b.href=m[1];}})();

var SKEY='coffee-shop';
var RATE=22050;            // café sound sits under 8 kHz; half rate keeps 16-bit at 159 MB
var MIN=60, LIVE=90, XF=3; // live loop length and loop crossfade, in seconds
var store={vol:60};
var ctx=null, gain=null, src=null, liveBuf=null, playing=false;

function $(id){ return document.getElementById(id); }
async function load(){
  try{ var r=await window.storage.get(SKEY); if(r&&r.value) store=Object.assign(store,JSON.parse(r.value)); }catch(e){}
  render();
}
async function persist(){ try{ await window.storage.set(SKEY, JSON.stringify(store)); }catch(e){} }

function render(){
  $('vol').value=store.vol;
  $('volTxt').textContent=store.vol+'%';
  $('play').classList.toggle('on',playing);
  $('play').innerHTML=playing?'&#10074;&#10074;':'&#9654;';
  $('play').setAttribute('aria-label',playing?'Stop':'Play');
  $('state').textContent=playing?'Playing':'Stopped';
}
function level(){ var v=store.vol/100; return v*v; }

/* ---- café synth: muffled murmur of several voices, room tone, cup clinks,
 * the odd steam-wand hiss, through a small room reverb. Stateful, so it can
 * be pulled in chunks of any size. ---- */
function rnd(a,b){ return a+Math.random()*(b-a); }
function bandpass(f,q){
  var w=2*Math.PI*f/RATE, al=Math.sin(w)/(2*q), a0=1+al;
  return {b0:al/a0, b2:-al/a0, a1:-2*Math.cos(w)/a0, a2:(1-al)/a0};
}
function makeCafe(){
  var voices=[], NV=7;
  function newVoice(v){
    v=v||{x1:0,x2:0,y1:0,y2:0,u1:0,u2:0,z1:0,z2:0,env:0,ph:0};
    v.f0=Math.random()<0.5?rnd(95,140):rnd(170,240);
    v.g=rnd(0.25,1); v.talk=Math.random()<0.5; v.left=rnd(0.5,3)*RATE; v.syl=0;
    v.F1=500; v.F2=1500; v.c1=bandpass(500,5); v.c2=bandpass(1500,6); v.amp=0;
    return v;
  }
  for(var i=0;i<NV;i++) voices.push(newVoice());
  var clinks=[], hiss={left:rnd(20,60)*RATE,on:0,len:0,t:0,h1:0};
  var brown=0, lp1=0, lp2=0;
  var combs=[1301,1637,1913,2203].map(function(n){ return {buf:new Float32Array(n),i:0}; });
  var n=0;

  function voiceStep(v){
    if(--v.left<=0){
      v.talk=!v.talk; v.left=(v.talk?rnd(1,5):rnd(0.4,3))*RATE;
      if(!v.talk && Math.random()<0.15) newVoice(v);      // someone leaves, someone sits down
    }
    if(--v.syl<=0){                                      // next syllable: new vowel, new loudness
      v.syl=rnd(0.12,0.3)*RATE;
      v.amp=v.talk?rnd(0.3,1):0;
      v.F1=rnd(300,800); v.F2=rnd(900,2300);
      v.c1=bandpass(v.F1,5); v.c2=bandpass(v.F2,6);
      v.f=v.f0*rnd(0.9,1.15);
    }
    v.env+=(v.amp-v.env)*0.0025;                         // ~20 ms smoothing
    if(v.env<1e-4) return 0;
    v.ph+=v.f/RATE; if(v.ph>=1) v.ph-=1;
    var s=(v.ph*2-1)*0.7+(Math.random()*2-1)*0.3;        // buzzy source + breath
    var c=v.c1, y=c.b0*s+c.b2*v.x2-c.a1*v.y1-c.a2*v.y2; v.x2=v.x1; v.x1=s; v.y2=v.y1; v.y1=y;
    c=v.c2; var z=c.b0*s+c.b2*v.u2-c.a1*v.z1-c.a2*v.z2; v.u2=v.u1; v.u1=s; v.z2=v.z1; v.z1=z;
    return (y+z*0.6)*v.env*v.g;
  }
  function clink(){
    var base=rnd(1800,3600), tau=rnd(0.04,0.18)*RATE, a=rnd(0.05,0.18);
    [1,2.32,3.89].forEach(function(m,k){
      var f=base*m; if(f>RATE*0.45) return;
      var w=2*Math.PI*f/RATE, r=Math.exp(-1/(tau/(k+1)));
      clinks.push({c:2*r*Math.cos(w), r2:r*r, y1:a/(k+1)*Math.sin(w), y2:0, left:tau*6});
    });
  }

  return function fill(out){
    for(var i=0;i<out.length;i++,n++){
      var m=0;
      for(var k=0;k<NV;k++) m+=voiceStep(voices[k]);
      lp1+=(m-lp1)*0.45; lp2+=(lp1-lp2)*0.45;            // muffle: distance + crowd
      m=lp2*1.4;

      brown=(brown+(Math.random()*2-1)*0.02)*0.98;       // room tone / HVAC hum
      var x=m+brown*0.4;

      if(Math.random()<1/(RATE*2.5)) clink();
      var cl=0;
      for(k=clinks.length-1;k>=0;k--){
        var o=clinks[k], y=o.c*o.y1-o.r2*o.y2; o.y2=o.y1; o.y1=y; cl+=y;
        if(--o.left<=0) clinks.splice(k,1);
      }
      x+=cl;

      if(hiss.on){                                        // steam wand
        var t=hiss.t++/hiss.len, e=Math.min(1,t*8,(1-t)*5);
        var w=Math.random()*2-1, hp=w-hiss.h1; hiss.h1=w;
        x+=hp*e*0.035;
        if(hiss.t>=hiss.len){ hiss.on=0; hiss.left=rnd(50,150)*RATE; }
      } else if(--hiss.left<=0){ hiss.on=1; hiss.t=0; hiss.len=rnd(3,8)*RATE; }

      var rv=0;                                           // small room
      for(k=0;k<4;k++){ var cb=combs[k], d=cb.buf[cb.i]; rv+=d; cb.buf[cb.i]=x+d*0.55; cb.i=(cb.i+1)%cb.buf.length; }
      x=x*0.75+rv*0.12;

      out[i]=Math.tanh(x*1.6)*0.8;
    }
  };
}

/* blend the last XF seconds into the start so the clip loops without a seam */
function seam(head,tail){
  var L=tail.length;
  for(var i=0;i<L;i++){ var f=i/L; head[i]=head[i]*f+tail[i]*(1-f); }
}

/* ---- live playback: a 90 s generated buffer on loop ---- */
function start(){
  if(!ctx){
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    gain=ctx.createGain(); gain.gain.value=0; gain.connect(ctx.destination);
  }
  ctx.resume();
  if(!liveBuf){
    var fill=makeCafe(), warm=new Float32Array(RATE*2); fill(warm);   // let voices settle in
    var d=new Float32Array(RATE*LIVE), tail=new Float32Array(RATE*XF);
    fill(d); fill(tail); seam(d,tail);
    liveBuf=ctx.createBuffer(1,d.length,RATE); liveBuf.getChannelData(0).set(d);
  }
  src=ctx.createBufferSource(); src.buffer=liveBuf; src.loop=true; src.connect(gain); src.start();
  var t=ctx.currentTime;
  gain.gain.cancelScheduledValues(t); gain.gain.setValueAtTime(0,t); gain.gain.linearRampToValueAtTime(level(),t+0.6);
  playing=true; render();
}
function stop(){
  var t=ctx.currentTime, s=src;
  gain.gain.cancelScheduledValues(t); gain.gain.setValueAtTime(gain.gain.value,t); gain.gain.linearRampToValueAtTime(0,t+0.25);
  setTimeout(function(){ try{ s.stop(); }catch(e){} },300);
  src=null; playing=false; render();
}
$('play').addEventListener('click',function(){ playing?stop():start(); });

$('vol').addEventListener('input',function(){
  store.vol=+this.value; $('volTxt').textContent=store.vol+'%';
  if(playing) gain.gain.setTargetAtTime(level(),ctx.currentTime,0.05);
});
$('vol').addEventListener('change',persist);

/* ---- download: 60 min 16-bit mono WAV at 22.05 kHz, built in 1 s chunks.
 * The first chunk is held back so the end can be blended into it. ---- */
function wavHeader(bytes){
  var h=new DataView(new ArrayBuffer(44));
  function str(o,s){ for(var i=0;i<s.length;i++) h.setUint8(o+i,s.charCodeAt(i)); }
  str(0,'RIFF'); h.setUint32(4,36+bytes,true); str(8,'WAVE');
  str(12,'fmt '); h.setUint32(16,16,true); h.setUint16(20,1,true); h.setUint16(22,1,true);
  h.setUint32(24,RATE,true); h.setUint32(28,RATE*2,true); h.setUint16(32,2,true); h.setUint16(34,16,true);
  str(36,'data'); h.setUint32(40,bytes,true);
  return h.buffer;
}
function pcm(f){
  var a=new Int16Array(f.length);
  for(var i=0;i<f.length;i++) a[i]=Math.round(f[i]*32767);
  return a;
}
$('dl').addEventListener('click',function(){
  var btn=this, secs=MIN*60, parts=[], k=0, fill=makeCafe(), buf=new Float32Array(RATE), head;
  btn.disabled=true;
  fill(new Float32Array(RATE*2));
  (function chunk(){
    var end=Math.min(k+10,secs);
    for(;k<end;k++){
      if(k<XF){ if(!head) head=new Float32Array(RATE*XF); fill(head.subarray(k*RATE,(k+1)*RATE)); continue; }
      fill(buf); parts.push(pcm(buf));
    }
    btn.textContent='Building… '+Math.round(k/secs*100)+'%';
    if(k<secs){ setTimeout(chunk,0); return; }
    var tail=new Float32Array(RATE*XF); fill(tail); seam(head,tail);
    parts.unshift(wavHeader(secs*RATE*2), pcm(head));
    var url=URL.createObjectURL(new Blob(parts,{type:'audio/wav'}));
    var a=document.createElement('a'); a.href=url; a.download='coffee-shop-'+MIN+'min.wav';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); },60000);
    btn.disabled=false; btn.textContent='Download '+MIN+' min';
  })();
});

load();
</script>
</body>
</html>
